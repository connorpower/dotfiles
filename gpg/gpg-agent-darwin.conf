# Use the macOS pinentry, which offers a "Save in Keychain" checkbox. Once
# saved, the agent reads the passphrase from the login keychain and stops
# prompting on commits.
pinentry-program /opt/homebrew/bin/pinentry-mac

# Cache the passphrase for a working day rather than the 10 minute default.
default-cache-ttl 28800
max-cache-ttl 86400
