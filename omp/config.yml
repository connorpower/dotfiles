modelRoles:
  default: anthropic/claude-opus-5-5:high
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
  light: light
setupVersion: 2
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - token_total
    - cost
    - context_pct
    - usage
tui:
  completeScrollback: true
  vimMode: true
  vimModeDisplay: text
commands:
  enableClaudeUser: true
enabledProviders:
  - claude
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
display:
  hideToolActivity: true
startup:
  quiet: true
task:
  eager: always
  enableEffort: true
todo:
  eager: always
tier:
  openai: none