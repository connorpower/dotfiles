packages:

  # Base
  # --------
  # Packages to be installed on all machines: both personal and work

  base:
    # Packages built from source with cargo. Prefer a prebuilt package from
    # the OS package manager and only fall back to here when there is none.
    cargo:
      # The calc in brew, pacman and apt is a different program: Landon Curt
      # Noll's C calculator, which installs a binary of the same name.
      - calc

    # Rust tools that apt does not package. macOS and Arch install these
    # prebuilt from the lists below.
    cargo-debian:
      - bacon
      - bottom@0.12.1 # 0.13.0+ needs unstable if-let-guards despite declaring rust-version 1.85 (rust-lang/rust#51114)
      - cargo-update
      - du-dust
      - starship
      - viu

    # Packages which have the same package name across all package managers
    universal:
      # General
      - bat
      - eza
      - ripgrep
      - tealdeer
      - tmux
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - tig
      - imagemagick
      - fzf
      # Dev
      - doxygen
      - git
      - git-delta
      - git-filter-repo
      - gnupg
      - graphviz
      - jq
      - llvm
      - cmake
      # Rice
      - cmatrix
      - fastfetch

    debian:
      - fd-find # apt installs this as fdfind; install.sh links it to fd
      - zsh
      - unzip
      - git-lfs
      - gh
      - neovim

    # Tools that ship their own curl-piped install script rather than a
    # package-manager package. Entries are 'name@url'; name is checked on
    # PATH before running the script.
    scripts:
      debian:
        - herdr@https://herdr.dev/install.sh
      arch:
        - herdr@https://herdr.dev/install.sh

    arch:
      # Base Tools
      - git
      - base-devel
      - aws-cli
      - bat-extras
      - neovim
      - man-db
      - ntp
      # Networking
      - openssh
      - nftables
      - dhcpcd
      # Hardware
      - amd-ucode
      - r8168
      - iw
      - netctl
      - dialog
      - wpa_supplicant
      - openresolv
      - bluez
      - bluez-utils
      # Compositor & GUI
      - libinput
      - waybar
      - wl-clipboard
      - swaylock
      - gnome-themes-extra
      - gnome-tweaks
      # General
      - ttf-nerd-fonts-symbols # for starship
      - pacman-contrib
      - perl-rename
      - light
      - timew
      - wget
      - zathua-pdf-mupdf
      - ranger
      - python-pillow # required for ranger img preview in kitty
      - gimp
      - grim
      - slurp
      - drawio-desktop-bin
      - unzip
      - shotwell
      # Audio
      - sof-firmware
      - alsa-firmware
      - alsa-ucm-conf
      - alsa-utils
      - pulseaudio-bluetooth
      - pulseadio
      - pamixer
      # Dev
      - gnu-netcat
      - github-cli
      - glab
      # Rust CLI tools
      - bacon
      - bottom
      - cargo-update
      - dust
      - fd
      - starship
      - viu

    arch-aur:
      # Compositor
      - hyprland-git
      # General
      - rofi-lbonn-wayland
      - hyprpicker-git
      # Fonts
      - ttf-recursive

    darwin:
      # Base Dev Tools
      - pkg-config
      # General
      - neovim
      - rust-analyzer
      - kitty
      - coreutils
      - bat-extras
      - rename
      - ddcctl
      - gnu-tar
      - pinentry-mac
      - hashicorp/tap/terraform
      # Rice
      - pipes-sh
      # Dev
      - gh
      - glab
      - awscli
      - herdr
      # Rust CLI tools
      - bacon
      - bottom
      - cargo-update
      - dust
      - fd
      - starship
      - viu
      # Fonts
      - font-hack-nerd-font
      - font-recursive-code
      # Apps
      - 1password-cli
      - moom
      - bartender
      - tidal
      - signal


  # Personal
  # --------
  # Packages to be installed on only personal machines

  personal:

    # Packages which have the same package name across all package managers
    universal:
      # Utils
      - yt-dlp
      - ffmpeg

    # Arch official packages
    arch:
      - signal-desktop
      - pdftk
      - nodejs
      - npm

    # Arch AUR packages
    arch-aur:
      # General
      - 1password-cli
      - tidal-hifi-bin
      - tasksh
      # Rice
      - cava
      - pipes.sh
      - cbonsai

    # Homebrew packages
    darwin:
      # General
      - dropbox
      - tasksh
      - imapsync

    # Debian packages
    debian:

  # Work
  # --------
  # Packages to be installed on only work machines

  work:

    # apt has no cargo-nextest package.
    cargo-debian:
      - cargo-nextest # provides `cargo nextest`

    scripts:
      universal:
        - uv@https://astral.sh/uv/install.sh

    # Arch official packages
    arch:
      - cargo-nextest # provides `cargo nextest`

    # Homebrew packages
    darwin:
      - cargo-nextest # provides `cargo nextest`
      - cocoapods # provides the `pod` CLI, for iOS dependencies
      - fvm # Flutter version manager; work.zsh puts ~/fvm/default/bin on PATH
      - libpq # keg-only; zsh.d sets PQ_LIB_DIR so linkers can find it
      - wix/brew/applesimutils # iOS simulator CLI, from the wix/brew tap
      - protobuf # provides the `protoc` compiler

    # Debian packages
    debian:
      - protobuf-compiler # provides the `protoc` compiler

