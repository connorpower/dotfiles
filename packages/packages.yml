packages:

  # Base
  # --------
  # Packages to be installed on all machines: both personal and work

  base:
    # Packages built from source with cargo. Prefer a prebuilt package from
    # the OS package manager and only fall back to here when there is none.
    cargo:
      # The calc in brew and apt is a different program: Landon Curt
      # Noll's C calculator, which installs a binary of the same name.
      - calc

    # Rust tools that apt does not package. macOS installs these prebuilt
    # from the list below.
    cargo-debian:
      - bacon
      - bottom@0.12.1 # 0.13.0+ needs unstable if-let-guards despite declaring rust-version 1.85 (rust-lang/rust#51114)
      - cargo-update
      - du-dust
      - starship
      - viu

    # Packages which have the same package name across all package managers,
    # and that the oldest supported Ubuntu (26.04) packages. See "Package
    # changes" in AGENTS.md.
    universal:
      # General
      - bat
      - eza
      - ripgrep
      - tealdeer
      - tmux
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - tig
      - imagemagick
      - fzf
      # Dev
      - doxygen
      - git
      - git-delta
      - git-filter-repo
      - gnupg
      - graphviz
      - jq
      - llvm
      - shellcheck
      - cmake
      # Rice
      - cmatrix
      - fastfetch

    debian:
      - fd-find # apt installs this as fdfind; install.sh links it to fd
      - zsh
      - unzip
      - git-lfs
      - gh
      - neovim
      - terraform # from the HashiCorp apt repository bootstrap() adds

    # Tools that ship their own curl-piped install script rather than a
    # package-manager package. Entries are 'name@url'; name is checked on
    # PATH before running the script.
    scripts:
      debian:
        - herdr@https://herdr.dev/install.sh
        - omp@https://omp.sh/install # prebuilt binary, checksum verified
    darwin:
      # Base Dev Tools
      - pkg-config
      # General
      - neovim
      - rust-analyzer
      - kitty
      - coreutils
      - bat-extras
      - rename
      - ddcctl
      - gnu-tar
      - pinentry-mac
      - hashicorp/tap/terraform
      # Rice
      - pipes-sh
      # Dev
      - actionlint # Debian and Ubuntu: install_actionlint() in install.sh
      - gh
      - glab
      - awscli
      - herdr
      - can1357/tap/omp # from the can1357/tap tap, see bootstrap()
      # Rust CLI tools
      - bacon
      - bottom
      - cargo-update
      - dust
      - fd
      - starship
      - viu
      # Fonts
      - font-hack-nerd-font
      - font-recursive-code
      # Apps
      - 1password-cli
      - moom
      - bartender
      - tidal
      - signal


  # Personal
  # --------
  # Packages to be installed on only personal machines

  personal:

    # Packages which have the same package name across all package managers
    universal:
      # Utils
      - yt-dlp
      - ffmpeg

    # Homebrew packages
    darwin:
      # General
      - dropbox
      - tasksh
      - imapsync

    # Debian packages
    debian:

  # Work
  # --------
  # Packages to be installed on only work machines. Those run macOS and
  # WSL2 Debian.

  work:

    # apt has no cargo-nextest package.
    cargo-debian:
      - cargo-nextest # provides `cargo nextest`

    scripts:
      universal:
        - uv@https://astral.sh/uv/install.sh
        # No package manager ships atomic. The npm package needs node. macOS
        # installs none, and a global install under nvm on WSL2 breaks when
        # the node version changes. The installer instead unpacks a
        # self-contained archive under ~/.local/share/atomic and links
        # ~/.local/bin/atomic, which zsh/rc already puts on PATH.
        - atomic@https://raw.githubusercontent.com/bastani-inc/atomic/main/install.sh

    # Global npm installs, for tools that ship no package-manager package.
    # node comes from brew on macOS and from nvm on WSL2 Debian. A global
    # install belongs to the node version that made it, so an nvm switch to a
    # new LTS drops these. Re-run this script after one.
    npm:
      universal:
        - "@nanonets/graft" # provides the `graft` CLI

    # Homebrew packages
    darwin:
      - atlassian/acli/acli # Atlassian CLI, from the atlassian/homebrew-acli tap
      - cargo-nextest # provides `cargo nextest`
      - cocoapods # provides the `pod` CLI, for iOS dependencies
      - facebook/fb/idb-cli # the `idb` CLI, from the facebook/fb tap
      - facebook/fb/idb-companion # the `idb_companion` server, same tap
      - fvm # Flutter version manager; work.zsh puts ~/fvm/default/bin on PATH
      - libpq # keg-only; zsh.d sets PQ_LIB_DIR so linkers can find it
      - node # provides node and npm, for the npm key above
      - protobuf # provides the `protoc` compiler

    # Debian packages
    debian:
      - acli # Atlassian CLI, from the apt repository bootstrap() adds
      - protobuf-compiler # provides the `protoc` compiler


# Commands
# --------
# Commands that `install.sh -v` expects to find on PATH in a fresh interactive
# zsh, laid out like the package lists above. A package name is often not the
# command name (ripgrep installs rg, bottom installs btm), so list the command.
# Add a tool's command here whenever you add the tool above, and leave out
# packages that install no command, such as zsh plugins and fonts.

commands:

  base:
    universal:
      - actionlint
      - bat
      - bacon
      - btm
      - calc
      - cargo-install-update
      - cmake
      - cmatrix
      - delta
      - doxygen
      - dust
      - eza
      - fastfetch
      - fd
      - fzf
      - gh
      - git
      - git-filter-repo
      - git-lfs
      - gpg
      - herdr
      - jq
      - nvim
      - omp
      - rg
      - shellcheck
      - starship
      - terraform
      - aws
      - tig
      - tldr
      - tmux
      - unzip
      - viu
      - zsh

  personal:
    universal:
      - ffmpeg
      - yt-dlp

  work:
    universal:
      - acli
      - atomic
      - cargo-nextest
      - graft
      - protoc
      - uv
